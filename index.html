<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Sayaç Analizi</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body style="background: #121212; color: #00ff00; font-family: 'Courier New', monospace; text-align: center;">

    <h2 style="color: white;">SAYAÇ ANALİZ TERMİNALİ</h2>
    
    <div style="margin: 20px; border: 2px dashed #333; padding: 20px;">
        <input type="file" id="imageInput" accept="image/*" capture="camera">
        <p style="font-size: 12px; color: #888;">Not: Sadece rakamlara odaklanılır.</p>
    </div>

    <canvas id="canvasOutput" style="max-width: 100%; border: 1px solid #00ff00; margin-bottom: 10px;"></canvas>
    
    <div id="status" style="color: #ffc107; margin-bottom: 10px;">OpenCV Yükleniyor...</div>
    <div id="result" style="font-size: 32px; background: #000; padding: 10px; border-radius: 5px;">---</div>

    <script>
        function onOpenCvReady() {
            document.getElementById('status').innerText = "Sistem Hazır. Fotoğrafı Yükle.";
        }

        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('canvasOutput');

        imageInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                // --- GÖRÜNTÜ İŞLEME (Preprocessing) ---
                let src = cv.imread(canvas);
                let dst = new cv.Mat();
                
                // 1. Gri Tonlamaya Çevir
                cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY, 0);
                
                // 2. Kontrastı Artır ve Gürültüyü Sil (Thresholding)
                // Bu adım, yansımaları silip rakamları siyah-beyaz yapar
                cv.threshold(src, dst, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
                
                // İşlenmiş görüntüyü canvas'a bas
                cv.imshow('canvasOutput', dst);

                // --- TESSERACT ANALİZİ ---
                document.getElementById('status').innerText = "Rakamlar ayıklanıyor...";
                
                const worker = await Tesseract.createWorker('eng');
                
                // Kritik Parametreler: Sadece rakam, nokta ve virgül
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789.,',
                    tessedit_pageseg_mode: '6', // Bloğu tek bir metin satırı olarak gör
                });

                const { data: { text } } = await worker.recognize(canvas);
                
                // Sadece rakamları tutan Regex temizliği
                const numericOnly = text.replace(/[^0-9.]/g, '');
                
                document.getElementById('status').innerText = "Tamamlandı!";
                document.getElementById('result').innerText = numericOnly || "Okunamadı!";

                // Hafızayı temizle
                src.delete(); dst.delete();
                await worker.terminate();
            };
        };
    </script>
</body>
</html>
