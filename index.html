<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayaç Analiz Pro v2</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background: #121212; color: #00ff00; font-family: monospace; text-align: center; padding: 10px; }
        .camera-wrapper { position: relative; display: inline-block; width: 100%; max-width: 480px; }
        video { width: 100%; border: 2px solid #333; border-radius: 8px; }
        
        /* Kırmızı Çerçeve - Biraz daha daralttım */
        .overlay-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; height: 25%;
            border: 3px solid #ff0000;
            box-shadow: 0 0 0 100vw rgba(0, 0, 0, 0.85); /* Etrafı daha karanlık */
            z-index: 10;
        }

        .controls { background: #222; padding: 15px; margin-top: 10px; border-radius: 8px; border: 1px solid #444; }
        input[type=range] { width: 100%; margin: 10px 0; accent-color: #28a745; }
        
        /* İşlenen görüntü canvası */
        canvas { 
            border: 2px solid #00ff00; 
            background: #fff; 
            width: 90%; 
            height: auto; 
            margin-top: 10px; 
            image-rendering: pixelated; /* Pikselleri net göster */
        }

        button { 
            background: linear-gradient(45deg, #28a745, #218838); 
            color: white; padding: 15px 30px; 
            border: none; font-size: 20px; font-weight: bold;
            border-radius: 5px; width: 100%; margin-top: 15px; cursor: pointer;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h3>SAYAÇ OKUYUCU v2.0</h3>

    <div class="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <div class="overlay-box"></div>
    </div>

    <div class="controls">
        <label>1. EŞİK AYARI (Siyahlık): <span id="valDisplay" style="color:white">100</span></label>
        <input type="range" id="thresholdSlider" min="0" max="255" value="90">
        
        <label style="display:block; margin-top:10px;">
            <input type="checkbox" id="thickCheck" checked> Rakamları Kalınlaştır (Önemli!)
        </label>
        
        <p style="margin-bottom:5px; color:#ccc;">Netlik Önizlemesi:</p>
        <canvas id="previewCanvas"></canvas>
        
        <button onclick="runOCR()">SAYIYI OKU</button>
    </div>

    <div id="resultBox" style="margin-top: 20px; padding: 10px; border: 1px dashed #555;">
        <div style="font-size: 14px; color: #888;">Ham Veri: <span id="rawResult">---</span></div>
        <div id="finalResult" style="font-size: 32px; color: yellow; font-weight: bold; margin-top:5px;">---</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const slider = document.getElementById('thresholdSlider');
        const valDisplay = document.getElementById('valDisplay');
        const thickCheck = document.getElementById('thickCheck');
        
        // Kamerayı Başlat
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            video.srcObject = stream;
            requestAnimationFrame(processLoop);
        });

        function processLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // 1. Kırpma Koordinatları
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const cropW = vw * 0.85; // CSS ile aynı oran
                const cropH = vh * 0.25;
                const cropX = (vw - cropW) / 2;
                const cropY = (vh - cropH) / 2;

                canvas.width = cropW;
                canvas.height = cropH;

                // 2. Çizim
                ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                // 3. Görüntü İşleme (Pixel Manipulation)
                let frame = ctx.getImageData(0, 0, cropW, cropH);
                let data = frame.data;
                let thresh = parseInt(slider.value);
                
                // Binary (Siyah-Beyaz) Çevirme
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] + data[i+1] + data[i+2]) / 3;
                    // Eğer eşikten düşükse (koyuysa) SİYAH (0), yoksa BEYAZ (255)
                    let c = (avg < thresh) ? 0 : 255;
                    data[i] = data[i+1] = data[i+2] = c;
                }

                // 4. Kalınlaştırma (Dilation) - Rakamları birleştirir
                if (thickCheck.checked) {
                    dilate(data, cropW, cropH);
                }

                ctx.putImageData(frame, 0, 0);
            }
            requestAnimationFrame(processLoop);
        }

        // Basit Dilation Fonksiyonu (Pikselleri komşulara yayar)
        function dilate(data, w, h) {
            let copy = new Uint8ClampedArray(data); // Orijinalin kopyası
            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    let idx = (y * w + x) * 4;
                    // Eğer piksel siyahsa (0), etrafını da siyah yap
                    if (copy[idx] === 0) { 
                        makeBlack(data, idx - 4);       // Sol
                        makeBlack(data, idx + 4);       // Sağ
                        makeBlack(data, idx - (w * 4)); // Üst
                        makeBlack(data, idx + (w * 4)); // Alt
                    }
                }
            }
        }
        function makeBlack(d, i) { d[i] = 0; d[i+1] = 0; d[i+2] = 0; }

        slider.oninput = function() { valDisplay.innerText = this.value; }

        async function runOCR() {
            const resRaw = document.getElementById('rawResult');
            const resFinal = document.getElementById('finalResult');
            
            resFinal.innerText = "OKUNUYOR...";
            resFinal.style.color = "yellow";

            const worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789.', // Sadece rakamlar
                tessedit_pageseg_mode: '6' // ÖNEMLİ: Blok modu (Tek satır değil!)
            });
            
            const { data: { text } } = await worker.recognize(canvas);
            
            console.log("Ham Çıktı:", text);
            resRaw.innerText = text.replace(/\n/g, " "); // Ham veriyi göster (debug için)
            
            // Temizlik
            let clean = text.replace(/[^0-9.]/g, ""); 
            
            if (clean.length > 0) {
                resFinal.innerText = clean;
                resFinal.style.color = "#00ff00";
            } else {
                resFinal.innerText = "OKUNAMADI";
                resFinal.style.color = "red";
            }
            
            await worker.terminate();
        }
    </script>
</body>
</html>
