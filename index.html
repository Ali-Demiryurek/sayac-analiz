<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayaç Kamera Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; margin: 0; }
        video { width: 90%; max-width: 500px; border: 3px solid #f1c40f; margin-top: 20px; border-radius: 10px; background: #000; }
        button { padding: 15px 30px; font-size: 18px; margin-top: 20px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; }
        #status { margin-top: 15px; color: #fbc531; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Ar-Ge Kamera Testi</h2>
    
    <video id="video" autoplay playsinline muted></video>
    
    <br>
    <button id="startBtn">KAMERAYI AÇ</button>
    <div id="status">Lütfen butona basın.</div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        startBtn.onclick = async () => {
            status.innerText = "Kamera isteniyor...";
            
            const constraints = {
                video: { 
                    facingMode: "environment", // Arka kamerayı zorla
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Bazı Android cihazlarda video.play() manuel çağrılmalıdır
                video.onloadedmetadata = () => {
                    video.play();
                    status.innerText = "Kamera Başarıyla Açıldı!";
                    startBtn.style.display = 'none'; // Açıldıktan sonra butonu gizle
                };
            } catch (err) {
                status.innerText = "HATA: " + err.name;
                console.error(err);
                
                // Eğer arka kamera bulunamazsa, genel bir kamera dene
                if (err.name === "OverconstrainedError" || err.name === "NotFoundError") {
                    status.innerText = "Arka kamera bulunamadı, varsayılan deneniyor...";
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(s => { video.srcObject = s; video.play(); });
                }
            }
        };
    </script>
</body>
</html>
