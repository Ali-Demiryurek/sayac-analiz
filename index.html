<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Sayaç OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body style="background: #121212; color: white; font-family: sans-serif; text-align: center;">

    <h2>Sayaç Analiz Sistemi</h2>
    
    <div style="margin: 20px;">
        <input type="file" id="imageInput" accept="image/*" capture="camera" style="display: none;">
        <button onclick="document.getElementById('imageInput').click()" 
                style="padding: 15px 30px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            FOTOĞRAF ÇEK / YÜKLE
        </button>
    </div>

    <canvas id="processCanvas" style="display:none;"></canvas>
    <img id="preview" style="max-width: 90%; border: 2px solid #555; display: none;">

    <div id="status" style="margin-top: 20px; color: #ffc107;">Sistem Hazır...</div>
    
    <div id="result" style="font-size: 24px; margin-top: 20px; font-weight: bold; color: #00ff00;"></div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const status = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        imageInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.innerText = "Görüntü işleniyor (Gürültü azaltılıyor)...";
            
            // Tesseract'ı başlat
            const worker = await Tesseract.createWorker('eng'); // Sayısal veriler için 'eng' yeterli

            // Filtreleme ve Tanıma İşlemi
            try {
                const { data: { text } } = await worker.recognize(file, {
                    // Sadece rakamları ve noktayı tanıması için kısıtlıyoruz (Beyaz Liste)
                    tessedit_char_whitelist: '0123456789.T'
                });

                // Regex ile 5.8.0 veya benzeri formatları ayıkla
                const cleanedText = text.replace(/\s/g, '');
                status.innerText = "İşlem Tamamlandı!";
                resultDiv.innerText = "Okunan Değer: " + (cleanedText || "Anlaşılamadı");
                
                console.log("Ham Veri:", text);
            } catch (err) {
                status.innerText = "Hata oluştu!";
                console.error(err);
            }

            await worker.terminate();
        };
    </script>
</body>
</html>
