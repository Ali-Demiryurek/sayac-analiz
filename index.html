<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kesin Çözüm: Sayaç OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; text-align: center;">

    <h2>SAYAÇ ANALİZİ v3.0</h2>
    <input type="file" id="imageInput" accept="image/*" style="margin: 20px;">
    
    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <div>
            <p>1. Orijinal İşlenmiş</p>
            <canvas id="canvasPre" style="border: 1px solid #555; max-width: 400px;"></canvas>
        </div>
    </div>

    <div id="result" style="font-size: 40px; margin-top: 20px; border: 2px solid #0f0; display: inline-block; padding: 10px;">
        BEKLENİYOR...
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');

        imageInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                let src = cv.imread(img);
                let gray = new cv.Mat();
                
                // 1. Gri tonlama
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                
                // 2. Gürültü engelleme (Gaussian Blur)
                let ksize = new cv.Size(5, 5);
                cv.GaussianBlur(gray, gray, ksize, 0, 0, cv.BORDER_DEFAULT);

                // 3. ADAPTIVE THRESHOLD (En kritik nokta)
                // Bu işlem yansımaları siler, sadece rakamları bırakır
                cv.adaptiveThreshold(gray, gray, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);

                // 4. Invert (Rakamları siyah, arka planı beyaz yap - Tesseract beyazda siyah sever)
                cv.bitwise_not(gray, gray);

                cv.imshow('canvasPre', gray);

                const worker = await Tesseract.createWorker('eng');
                
                // Ayarları katılaştırıyoruz
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789.', // HARF GİRİŞİ YASAK
                    tessedit_pageseg_mode: '7',            // Tek bir kelime/sayı satırı gibi gör
                    tessjs_create_hocr: '0',
                    tessjs_create_tsv: '0'
                });

                const { data: { text } } = await worker.recognize(document.getElementById('canvasPre'));
                
                // Sadece sayısal karakterleri nihai olarak temizle
                const finalResult = text.trim().replace(/[^0-9.]/g, '');
                
                document.getElementById('result').innerText = finalResult || "HATA: TEKRAR ÇEK";

                src.delete(); gray.delete();
                await worker.terminate();
            };
        };
    </script>
</body>
</html>
