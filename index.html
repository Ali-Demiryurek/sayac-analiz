<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sayaç Analiz Pro v4</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: white; text-align: center; }
        #display-container { position: relative; width: 100%; height: 50vh; background: #000; }
        video, #preview { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        #preview { display: none; z-index: 2; border: 4px solid #27ae60; }
        .focus-rect { 
            position: absolute; top: 25%; left: 5%; width: 90%; height: 40%; 
            border: 3px solid #ff3333; box-shadow: 0 0 0 2000px rgba(0,0,0,0.6); 
            z-index: 5; pointer-events: none;
        }
        #controls { padding: 15px; background: #1e1e1e; }
        #snap { background: #27ae60; color: white; border: none; padding: 18px; font-size: 18px; border-radius: 10px; width: 100%; font-weight: bold; }
        #data-panel { padding: 15px; background: #252a34; text-align: left; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; font-size: 18px; }
        .row b { color: #f1c40f; font-family: monospace; }
        #debug-box { font-size: 11px; color: #888; margin-top: 10px; background: #000; padding: 5px; word-break: break-all; }
        canvas { display: none; }
    </style>
</head>
<body>

<div id="display-container">
    <video id="video" autoplay playsinline></video>
    <img id="preview" alt="Çekilen">
    <div class="focus-rect"></div>
</div>

<div id="controls">
    <div id="status" style="margin-bottom:10px; color:#fbc531;">SAYACA ODAKLANIN</div>
    <button id="snap">FOTOĞRAF ÇEK VE ANALİZ ET</button>
</div>

<div id="data-panel">
    <div class="row"><span>1.8.0 (Aktif):</span> <b id="r180">---</b></div>
    <div class="row"><span>5.8.0 (Endüktif):</span> <b id="r580">---</b></div>
    <div class="row"><span>8.8.0 (Kapasitif):</span> <b id="r880">---</b></div>
    <div id="debug-box">Ham Veri: Bekleniyor...</div>
</div>

<canvas id="c"></canvas>

<script>
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const snap = document.getElementById('snap');
    const status = document.getElementById('status');
    const debug = document.getElementById('debug-box');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } })
        .then(s => video.srcObject = s);

    snap.onclick = async () => {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        // 1. Görüntüyü Dondur
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        preview.src = canvas.toDataURL('image/jpeg');
        preview.style.display = 'block';
        snap.disabled = true;
        status.innerText = "GÖRÜNTÜ İŞLENİYOR...";

        // 2. OCR İçin Özel Kırpma ve Eşikleme (Binarization)
        const crop = document.createElement('canvas');
        const cCtx = crop.getContext('2d');
        const w = video.videoWidth * 0.9;
        const h = video.videoHeight * 0.4;
        crop.width = w;
        crop.height = h;

        // AGRESİF FİLTRE: Gri tonlama + Çok yüksek kontrast + Parlaklık ayarı
        cCtx.filter = 'grayscale(100%) contrast(400%) brightness(100%) invert(0%)';
        cCtx.drawImage(video, video.videoWidth * 0.05, video.videoHeight * 0.25, w, h, 0, 0, w, h);

        try {
            const result = await Tesseract.recognize(crop.toDataURL('image/png'), 'eng', {
                logger: m => { if(m.status === 'recognizing text') status.innerText = "Okunuyor: %" + Math.round(m.progress*100); }
            });

            const text = result.data.text;
            debug.innerText = "Ham Veri: " + text;

            // ESNEK PARSE: Noktaları ve harf benzeri hataları (I, O, B) temizle
            const clean = text.toUpperCase().replace(/\s+/g, '');
            
            const parseVal = (code) => {
                // Koddan sonra gelen rakamları ve noktayı bul
                const escaped = code.replace(/\./g, '\\.?');
                const regex = new RegExp(escaped + ".*?(\\d+[\\.\\,]\\d{3})");
                const match = clean.match(regex);
                return match ? match[1].replace(',', '.') : "Bulunamadı";
            };

            document.getElementById('r180').innerText = parseVal("1.8.0");
            document.getElementById('r580').innerText = parseVal("5.8.0");
            document.getElementById('r880').innerText = parseVal("8.8.0");

            status.innerText = "ANALİZ TAMAMLANDI";
        } catch (e) {
            status.innerText = "HATA!";
        }
        snap.disabled = false;
    };
</script>
</body>
</html>
