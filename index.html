<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .camera-container { position: relative; width: 640px; height: 480px; margin: auto; }
        #video { width: 100%; height: 100%; background: #000; }
        /* Okuma Çerçevesi */
        .overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 100px;
            border: 3px solid #00ff00;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* Çerçeve dışını karart */
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="overlay"></div>
</div>

<button onclick="captureAndProcess()" style="display:block; margin:20px auto; padding:15px 30px; font-size:20px;">FOTOĞRAF ÇEK VE OKU</button>

<canvas id="cropCanvas" width="400" height="100" style="display:none;"></canvas>
<h2 id="result" style="text-align:center; color:#00ff00;">Sonuç: ---</h2>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('cropCanvas');

    // Kamerayı Başlat
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => video.srcObject = stream);

    async function captureAndProcess() {
        const ctx = canvas.getContext('2d');
        
        // Sadece çerçeve içindeki alanı yakala (Koordinatları manuel ayarla)
        // videoWidth ve videoHeight üzerinden oranlama yapıyoruz
        ctx.drawImage(video, 120, 190, 400, 100, 0, 0, 400, 100);

        const status = document.getElementById('result');
        status.innerText = "İşleniyor...";

        // Tesseract'ı sadece bu küçük alan için çalıştır
        const worker = await Tesseract.createWorker('eng');
        await worker.setParameters({
            tessedit_char_whitelist: '0123456789', // Sadece rakam
            tessedit_pageseg_mode: '7'             // Tek satır modu
        });

        const { data: { text } } = await worker.recognize(canvas);
        status.innerText = "Sonuç: " + text.replace(/[^0-9]/g, "");

        await worker.terminate();
    }
</script>
</body>
</html>
