<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body style="background:#1a1a1a; color:#0f0; text-align:center; font-family:monospace;">

    <h3>7-SEGMENT DİJİTAL OKUYUCU v4</h3>
    <input type="file" id="imageInput" accept="image/*" capture="camera">
    <br><br>
    <canvas id="outputCanvas" style="border:1px solid #0f0; max-width:100%;"></canvas>
    <h1 id="result">OKUNUYOR...</h1>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('outputCanvas');

        imageInput.onchange = async (e) => {
            const img = new Image();
            img.src = URL.createObjectURL(e.target.files[0]);
            img.onload = async () => {
                let src = cv.imread(img);
                let dst = new cv.Mat();

                // 1. GRİ TONLAMA VE KONTRAST
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY, 0);

                // 2. MORFOLOJİK KAPATMA (MORPH_CLOSE)
                // Bu işlem 7 segmentli rakamların arasındaki boşlukları yamalar, 
                // böylece Tesseract onları parçalı çizgiler değil, bütün bir rakam olarak görür.
                let ksize = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5));
                cv.morphologyEx(dst, dst, cv.MORPH_CLOSE, ksize);

                // 3. EŞİKLEME (Otsu Threshold)
                cv.threshold(dst, dst, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);

                cv.imshow('outputCanvas', dst);

                // TESSERACT'I 7-SEGMENT İÇİN ZORLA
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789', // Harf okumayı tamamen kapatır
                    tessedit_pageseg_mode: '7',           // Görüntüyü tek bir kelime/sayı olarak ele al
                    tessedit_ocr_engine_mode: '1'         // Sadece LSTM (Modern) motoru kullan
                });

                const { data: { text } } = await worker.recognize(canvas);
                document.getElementById('result').innerText = text.replace(/[^0-9]/g, "");

                src.delete(); dst.delete(); ksize.delete();
                await worker.terminate();
            };
        };
    </script>
</body>
</html>
